[tool.codespell]
# Real words/identifiers that codespell misreads as typos:
#   hel/serie/strin -> substrings in test fixtures; te -> local variable;
#   rouge -> the ROUGE metric; unparseable -> valid spelling variant;
#   re-use/re-used -> intentional hyphenation; lamda -> Google LaMDA project;
#   astroid -> AST library used by pylint; nin -> the MongoDB $nin operator.
ignore-words-list = "hel,serie,strin,te,rouge,unparseable,re-use,re-used,lamda,astroid,nin"
# CHANGELOG.md is generated from commit messages; lockfiles, notebooks, JSON
# fixtures, bundled JS/source maps, and the vendored CLI browser bundle are
# generated or data files, not prose we own.
skip = "*CHANGELOG.md,*.lock,*.ipynb,*.json,*.js,*.map,*/cli/browser/*,constraints-*.txt"

slack = ["slack-bolt>=1.22.0"]

[tool.pyink]
# Format py files following Google style-guide
line-length = 80
unstable = true
pyink-indentation = 2
pyink-use-majority-quotes = true
pyink-annotation-pragmas = [
  "noqa",
  "pylint:",
  "type: ignore",
  "pytype:",
  "mypy:",
  "pyright:",
  "pyre-",
]


[build-system]
# Build system specify which backend is used to build/install the project (flit,
# poetry, setuptools,...). All backends are supported by `pip install`
requires = ["flit_core >=3.8,<4"]
build-backend = "flit_core.buildapi"


[tool.flit.sdist]
include = ['src/**/*', 'README.md', 'pyproject.toml', 'LICENSE']
exclude = ['src/**/*.sh']


[tool.flit.module]
name = "google.adk"
include = ["py.typed"]


[tool.isort]
profile = "google"
single_line_exclusions = []
line_length = 200                  # Prevent line wrap flickering.
known_third_party = ["google.adk"]


[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"


[tool.mypy]
python_version = "3.10"
exclude = ["tests/", "contributing/samples/"]
plugins = ["pydantic.mypy"]
strict = true
disable_error_code = ["import-not-found", "import-untyped", "unused-ignore"]
follow_imports = "skip"
